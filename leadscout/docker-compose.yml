# CPU box stack. Everything listens on 127.0.0.1 only.
# The LLM arrives on 127.0.0.1:8001 through a reverse SSH tunnel opened by the GPU instance.
# api and worker use host networking so they can reach that tunnel endpoint.

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  api:
    image: leadscout:${LEADSCOUT_TAG:-0.1.1}
    build: ./app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/leadscout.db
      SEARXNG_URL: http://127.0.0.1:8888
    command: ["uvicorn", "leadscout.api:app", "--host", "${API_BIND:-127.0.0.1}", "--port", "8090"]
    volumes:
      - leadscout-data:/data

  worker:
    image: leadscout:${LEADSCOUT_TAG:-0.1.1}
    build: ./app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/leadscout.db
      SEARXNG_URL: http://127.0.0.1:8888
    command: ["python", "-m", "leadscout.worker"]
    volumes:
      - leadscout-data:/data
    depends_on: [searxng]

volumes:
  leadscout-data:
