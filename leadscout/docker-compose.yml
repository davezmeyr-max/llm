# CPU box stack. Everything listens on 127.0.0.1 only.
# The LLM arrives on 127.0.0.1:8001 through a reverse SSH tunnel opened by the GPU instance.
# api and worker use host networking so they can reach that tunnel endpoint.

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  api:
    image: leadscout:${LEADSCOUT_TAG:-0.1.6}
    build: ./app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/leadscout.db
      SEARXNG_URL: http://127.0.0.1:8888
    command: ["uvicorn", "leadscout.api:app", "--host", "${API_BIND:-127.0.0.1}", "--port", "8090"]
    volumes:
      - leadscout-data:/data

  worker:
    image: leadscout:${LEADSCOUT_TAG:-0.1.6}
    build: ./app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/leadscout.db
      SEARXNG_URL: http://127.0.0.1:8888
    command: ["python", "-m", "leadscout.worker"]
    volumes:
      - leadscout-data:/data
    depends_on: [searxng]

  # Optional: publish the API over HTTPS for your website's backend (Base44 backend functions).
  # Enabled when PUBLIC_HOSTNAME is set in .env (setup-cpu-box.sh adds --profile public).
  # Needs a DNS A record for PUBLIC_HOSTNAME pointing at this box and ports 80/443 open.
  caddy:
    image: caddy:2
    profiles: [public]
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

volumes:
  leadscout-data:
  caddy-data:
  caddy-config:
